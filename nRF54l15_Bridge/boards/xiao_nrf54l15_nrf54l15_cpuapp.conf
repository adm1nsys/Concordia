# Seeed XIAO nRF54L15 (Sense) - application configuration.
#
# Picked up automatically by filename, no need to list it as an extra fragment.

# Factory data is switched off in prj.conf - see the note there, it has to be
# done through the backend choice rather than CONFIG_CHIP_FACTORY_DATA=n.

# CONFIG_LTO is deliberately NOT set.
#
# It was added early on to squeeze the image into MCUboot's 664 KB slot. Once
# the bootloader went away the whole RRAM became available and LTO was no
# longer needed - but it stayed, and it corrupts the linker-section table that
# net_buf pools are looked up through. The result was a BUS FAULT with
# BFAR 0xa inside pool_get_uninit on the MPSL Work thread, right after BLE
# init: net_buf_alloc_len being handed a null pool.
#
# It behaved like a memory bug - intermittent, and more frequent as the image
# grew - because that is how LTO decisions shift. Turning it off fixed it
# outright: first flash, clean boot, every time. Costs 52 KB of flash out of
# 1524 KB, which is not a trade worth revisiting.
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y

# Consequences of building without MCUboot (see Kconfig.sysbuild).
#
# Matter's OTA requestor is written against MCUboot's DFU target; with no
# bootloader it still compiles but fails to link on
# `dfu_target_mcuboot_set_buf`. Both have to go together - this is a dependency
# of the bootloader choice, not a separate decision.
CONFIG_CHIP_BOOTLOADER_NONE=y
CONFIG_CHIP_OTA_REQUESTOR=n

# Shell tuning for a machine on the other end of the wire.
#
# The defaults are aimed at a person on a terminal; over a raw UART the escape
# sequences only get in the way of a parser. And `bridge add <type> <name>` or
# `bridge set <id> <v> <v2> <v3>` are long lines - the default command buffer
# truncates them.
CONFIG_SHELL_VT100_COLORS=n
CONFIG_SHELL_CMD_BUFF_SIZE=256

# The default 3168 bytes left next to nothing spare: `bridge pairing` added a
# couple of frames and the thread ran off the bottom of its own stack, taking
# the board down in MemManage on the very first call. Generating the onboarding
# codes is the deepest work any command here does, so the headroom is sized for
# that rather than for the shallowest one.
CONFIG_SHELL_STACK_SIZE=4096

# The actual cause of "the ESP sees nothing on the wire" before this board is
# paired to anything - not the board being broken, and not fixable by
# resetting either side of the link.
#
# Zephyr's shell thread runs at K_LOWEST_APPLICATION_THREAD_PRIO when nothing
# overrides it - one step above idle, below every other thread in this image.
# Zephyr's shell thread runs at K_LOWEST_APPLICATION_THREAD_PRIO when nothing
# overrides it - one step above idle, below every other thread in this image
# (BT/OpenThread sit at priorities 6-8). An uncommissioned board advertises
# over BLE continuously, which keeps those threads busy ahead of the shell on
# every scheduling decision, on a single core with no time-slicing across
# priority levels. The shell is not stuck; it simply never wins.
#
# Raised to 1 - one step below main(), clear of every BT/OpenThread thread,
# well short of the cooperative MPSL tier nothing preemptible can reach
# anyway. Verified over SWD (RAM-console build) that the node was genuinely
# losing the scheduling race, not crashed or starved outright - but the
# priority bump alone did not clear the symptom. The actual fix is
# architectural: BLE advertising now stays off until told to start (`bridge
# commission`) - see PORTING_NOTES.md and nrf_link.h's "deferred pairing"
# block. Left in place regardless: a correct, harmless improvement even
# though it was not sufficient by itself.
CONFIG_SHELL_THREAD_PRIORITY_OVERRIDE=y
CONFIG_SHELL_THREAD_PRIORITY=1

# How many bridged devices the board can host at once.
#
# Raised in stages during the rebuild - this is where the previous project
# died, so each step is flashed and verified before the next.
CONFIG_BRIDGE_MAX_ENDPOINTS=50

# Board identity.
#
# A controller keys an accessory on vendor+product+serial+discriminator, so the
# DK and the XIAO must not share them or a hub will treat the second board as
# the first one and refuse it.
#
# CONFIG_CHIP_DEVICE_DISCRIMINATOR is Kconfig type *hex*: writing =3840 means
# 0x3840 = 14400, which is outside the 12-bit range and aborts the application
# during QR generation. It has to be 0xF00.
CONFIG_CHIP_DEVICE_PRODUCT_NAME="Concordia One"
CONFIG_CHIP_DEVICE_VENDOR_NAME="Concordia"
CONFIG_CHIP_DEVICE_PRODUCT_ID=32770
CONFIG_CHIP_DEVICE_SERIAL_NUMBER="XIAO-54L15-0001"
CONFIG_CHIP_DEVICE_SOFTWARE_VERSION=1
CONFIG_CHIP_DEVICE_SOFTWARE_VERSION_STRING="Core One"
CONFIG_CHIP_DEVICE_HARDWARE_VERSION=1
CONFIG_CHIP_DEVICE_HARDWARE_VERSION_STRING="XIAO nRF54L15 Sense"
CONFIG_CHIP_DEVICE_MANUFACTURING_DATE="2026-01-01"
CONFIG_CHIP_DEVICE_DISCRIMINATOR=0xF00
CONFIG_CHIP_DEVICE_SPAKE2_PASSCODE=20202021
# Matter defaults BT_DEVICE_NAME_MAX to 15 and the BLE host checks the name
# against it at compile time, so a longer name fails the build outright rather
# than being truncated. This name is 37 characters.
CONFIG_BT_DEVICE_NAME="Concordia nRF54L15 Sense Xiao Edition"
CONFIG_BT_DEVICE_NAME_MAX=40

# OpenThread CLI in the image.
#
# `ot state`, `ot ipaddr`, `ot netdata show` and `ot ping` are the only way to
# tell a radio problem from an IPv6 routing one. That distinction is what
# eventually explained the old project's "offline in HomeKit": the board could
# ping the border router's ULA in 13 ms, and could not reach the global address
# Matter had picked - so the radio was never the problem. Reachable from the web
# console through the ESP, which makes it usable without a cable.
CONFIG_OPENTHREAD_SHELL=y

# Stack headroom and a guard, against the BUS FAULT / BFAR 0xa in MPSL Work.
#
# The fault reads a null net_buf pool pointer inside the radio's own thread,
# right after BLE init, and it is intermittent - it grew more frequent as the
# image grew, which is what a stack overflow into a neighbour's data looks like
# when the memory map shifts underneath it. The system workqueue's default
# 1120 bytes is thin for what this application puts on it.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# And make the next one say so: with the MPU guarding every stack, an overflow
# becomes an immediate "stack overflow" naming the guilty thread instead of
# silent corruption surfacing three subsystems away.
CONFIG_HW_STACK_PROTECTION=y

# On-board IMU (vibration / drop detection).
#
# No devicetree overlay is needed on 3.4.0 - the board files already declare the
# part as lsm6ds3tr_c / compatible "st,lsm6dsl" and point imu0 at it. Seeed's own
# zephyr-imu example notes that on the nRF54L15 the rail is already up
# (pdm_imu_pwr has regulator-boot-on) and the device auto-inits at boot.
CONFIG_BRIDGE_XIAO_IMU=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED=y

# ...but NOT the SoC-level regulator that CONFIG_REGULATOR otherwise drags in.
# It manages the chip's own power modes (note its HIBERNATE_MIN_UPTIME_MS
# companion), and enabling the IMU was crashing MPSL right after BLE init.
# Seeed's example gets away with it because it has no radio to destabilise.
CONFIG_REGULATOR_NRF54L=n

# ODR defaults to 0 = "runtime", which leaves the accelerometer powered down and
# every reading at 0 mg. 4 = 104 Hz.
CONFIG_LSM6DSL_ACCEL_ODR=4
CONFIG_LSM6DSL_ACCEL_FS=8

# Trim what is only there for debugging.
#
# The Matter test shell and the verbose logging were carried over from the
# template and cost RAM for nothing - the bridge has its own CLI and the ESP
# drives it. This is the profile the 3.2.3 firmware ran with.
# The bridge CLI needs the Zephyr shell, and until now it arrived for free as a
# side effect of the Matter shells. Turning those off takes it with them, so ask
# for it by name.
CONFIG_SHELL=y
CONFIG_CHIP_LIB_SHELL=n
CONFIG_NCS_SAMPLE_MATTER_TEST_SHELL=n
CONFIG_BRIDGE_DEBUG_LOG=n
CONFIG_MATTER_LOG_LEVEL_INF=y

# Hardware watchdog.
#
# Earned its place: an infinite loop in the IMU sampling thread once left the
# board burning CPU for hours, answering Matter but nothing else, with no way
# back except a manual reset. A watchdog turns that into a reboot.
CONFIG_NCS_SAMPLE_MATTER_WATCHDOG=y
