<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Concordia — setup</title>
<style>
:root{--bg:#14161a;--panel:#1b1e24;--panel2:#20242b;--ink:#e8e8ea;--muted:#8b9099;
      --line:#2b2f38;--accent:#3b6fd4;--bad:#e0776f;--ok:#6fbf7a}
*{box-sizing:border-box}
body{font:16px/1.55 system-ui,-apple-system,sans-serif;margin:0;background:var(--bg);
     color:var(--ink);min-height:100vh}
.wrap{max-width:36rem;margin:0 auto;padding:24px 20px 60px}
header{display:flex;align-items:center;gap:12px;margin-bottom:6px}
h1{font-size:1.1rem;margin:0;flex:1}
select#lang{background:var(--panel);color:var(--ink);border:1px solid var(--line);
     border-radius:7px;padding:.4em .6em;font:inherit}
.steps{display:flex;gap:5px;margin:18px 0 24px}
.steps i{flex:1;height:4px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--accent)}
.steps i.done{background:#4a7a4f}
h2{font-size:1.25rem;margin:0 0 6px}
p.sub{color:var(--muted);margin:0 0 18px;font-size:.92rem}
label{display:block;font-size:.85rem;color:var(--muted);margin:14px 0 5px}
input,select{width:100%;box-sizing:border-box;padding:.6em .7em;border:1px solid var(--line);
      border-radius:7px;background:var(--panel2);color:var(--ink);font:inherit}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
button{font:inherit;padding:.6em 1.1em;border:0;border-radius:7px;background:var(--accent);
       color:#fff;cursor:pointer}
button.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--ink)}
button.danger{background:#7a3a38}
button:disabled{background:#3a3f48;cursor:default;color:#7d838c}
button.sm{padding:.35em .7em;font-size:.85em}
.row{display:flex;gap:10px}
.row>*{flex:1}
.btns{display:flex;gap:10px;margin-top:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px}
.chk{display:flex;align-items:center;gap:10px;margin:12px 0}
.chk input{width:18px;height:18px;flex:0 0 auto}
.list{margin:8px 0 0;padding:0;list-style:none;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.list li{padding:.6em .8em;border-top:1px solid var(--line);font-size:.92rem;
         display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer}
.list li:first-child{border-top:0}
.list li:hover{background:var(--panel2)}
.list li span.db{color:var(--muted);font-size:.85em;white-space:nowrap}
.list li.other{color:var(--muted)}
.note{color:var(--muted);font-size:.85rem;margin-top:6px}
#msg{margin-top:16px;white-space:pre-wrap;font-size:.9rem;color:var(--muted)}
#msg.err{color:var(--bad)}
#msg.ok{color:var(--ok)}
.hide{display:none}
.x{background:transparent;border:0;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:0 4px}

#dlgBack{position:fixed;inset:0;background:rgba(6,7,10,.6);display:none;
         align-items:center;justify-content:center;padding:20px;z-index:20}
#dlgBack.open{display:flex}
#dlg{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;
     width:100%;max-width:24rem}
.dlgTitle{font-weight:640;font-size:1.02rem;word-break:break-word;margin-bottom:10px}
</style>

<div class="wrap">
<header><h1 id="h1">Concordia — first-run setup</h1>
  <select id="lang" aria-label="Language" onchange="setLang(this.value)">
    <option value="en">EN</option><option value="de">DE</option><option value="da">DA</option>
  </select>
</header>
<div class="steps" id="steps"></div>

<div id="body"></div>
<div id="msg"></div>
</div>

function tzOffsetMinutes(tz){
  try{
    const parts=new Intl.DateTimeFormat("en-US",{timeZone:tz,timeZoneName:"shortOffset"}).formatToParts(new Date());
    const part=(parts.find(p=>p.type==="timeZoneName")||{}).value||"";
    const m=/GMT([+-])(\d+)(?::(\d+))?/.exec(part);
    if(!m)return 0;
    return (m[1]==="-"?-1:1)*((+m[2])*60+(m[3]?+m[3]:0));
  }catch(e){return 0;}
}
function fmtOffset(min){
  const sign=min<0?"-":"+", a=Math.abs(min);
  return "UTC"+sign+String(Math.floor(a/60)).padStart(2,"0")+":"+String(a%60).padStart(2,"0");
}

 * leftover markup - the "Join" dialog's own fields, gone the moment "add

 * neither can leave anything behind for the other to trip over. */
function showDlgGeneric(bodyHtml,title,okLabel,onOk){
  $("dlg").innerHTML=`<div class="dlgTitle">${esc(title)}</div>
    ${bodyHtml}
    <div class="btns"><button id="dlgOk">${esc(okLabel)}</button>

    dlgClose();

}
function dlgClose(){$("dlgBack").classList.remove("open");}

/* Runs once, even if the visitor goes Back to step 1 and hits Next again to
 * review it - a second attempt would just be told the name is already
 * taken, which reads as a bug rather than as "already done". Renaming the
 * admin, if a typo slipped through, is a job for the panel afterwards. */
let usersCreated=false;

async function saveUsers(){
  if(!usersCreated){
    const name=$("uName").value.trim(), pass=$("uPass").value, pass2=$("uPass2").value;
    if(name.length<2)return t("errName");
    if(pass.length<8)return t("errPass");
    if(pass!==pass2)return t("errMatch");
    wiz.adminName=name; wiz.adminPass=pass;

    msg(t("savingUsers"));
    const created=await api("/api/users",
      "name="+encodeURIComponent(name)+"&password="+encodeURIComponent(pass)+"&role=admin");
    if(created.error){msg("",""); return created.error;}
    const login=await api("/api/session/login",
      "name="+encodeURIComponent(name)+"&password="+encodeURIComponent(pass));
    if(login.error){msg("","");return login.error;}
    usersCreated=true;
  }

  /* Extra people are each created once too, so going back to add one more
   * after the fact does not resubmit the ones that already exist. */
  for(const u of wiz.extra){
    if(u.created)continue;
    const body=new URLSearchParams();
    body.set("name",u.name);body.set("password",u.pass);body.set("role",u.role);
    if(u.role!=="admin"){
      body.set("control",u.control||"none");
      body.set("add",u.add?"1":"0");body.set("remove",u.remove?"1":"0");body.set("settings",u.settings?"1":"0");
    }
    const r=await api("/api/users",body.toString());
    if(r.error){
      /* Used to fail silently here and move on to the next person - a 401,
       * say, would leave someone missing with no indication anything went
       * wrong. Stop and say so instead; they are still in wiz.extra (not
       * marked created), so Next tries this same one again rather than
       * skipping it. */
      return u.name+": "+r.error;
    }
    u.created=true;
  }
  msg("","");
  return null;
}

/* -------------------------------------------------------- step: location */
function stepLocation(){
  /* Plain HTTP is not a secure context, and most browsers refuse
   * navigator.geolocation there - but not reliably enough to refuse the
   * button over it: some let it through anyway (an existing per-origin grant,
   * a relaxed profile, a browser that simply differs), and it has worked here
   * before. So: warn, do not block. The button stays live and useGeo() still
   * makes the real call; only an actual failure shows the message below. */
  const insecure=!window.isSecureContext;
  return `<h2>${esc(t("sLoc"))}</h2><p class="sub">${esc(t("sLocSub"))}</p>
    ${insecure?`<p class="note">${esc(t("locInsecure"))}</p>`:""}
    <div class="btns" style="margin-top:0">
      <button onclick="useGeo()">${esc(t("bGeo"))}</button>
      <button class="ghost" onclick="wiz.lat='';wiz.lon='';$('lLat').value='';$('lLon').value='';paintLoc()">${esc(t("bSkipLoc"))}</button>
    </div>
    <div class="row">
      <div><label>${esc(t("lat"))}</label><input id="lLat" value="${esc(wiz.lat)}" onchange="wiz.lat=this.value;paintLoc()"></div>
      <div><label>${esc(t("lon"))}</label><input id="lLon" value="${esc(wiz.lon)}" onchange="wiz.lon=this.value;paintLoc()"></div>
    </div>
    <p class="note" id="locPreview"></p>`;
}
function useGeo(){
  if(!navigator.geolocation){msg(t("locFail"),"err");return;}
  navigator.geolocation.getCurrentPosition(pos=>{
    wiz.lat=pos.coords.latitude.toFixed(4);
    wiz.lon=pos.coords.longitude.toFixed(4);
    $("lLat").value=wiz.lat; $("lLon").value=wiz.lon;
    paintLoc();
  },err=>{
    /* code 1 = PERMISSION_DENIED, which is also what an insecure-origin
     * refusal comes back as - point at the actual reason when it looks like
     * that one rather than the generic message. */
    const blocked=err&&err.code===1&&!window.isSecureContext;
    msg(t(blocked?"locInsecure":"locFail"),"err");
  });
}
async function paintLoc(){
  const p=$("locPreview");
  if(!wiz.lat||!wiz.lon){p.textContent="";return;}
  p.textContent="…";
  try{
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${wiz.lat}&longitude=${wiz.lon}&current=temperature_2m`);
    const j=await r.json();
    p.textContent=t("locPreview")+" "+j.current.temperature_2m+" °C";
  }catch(e){p.textContent=t("locFail");}
}

/* -------------------------------------------------------- saved networks
 * Requested after the first real run: this step could add a network but not
 * remove or fix one. Same forget-then-save edit as the panel's Settings
 * screen and the portal page - the hub has no in-place update - and, like
 * the portal's version, editing does not call `wifi join`: this step is
 * reached because the hub is already online, and there is no reason for
 * fixing a *fallback* entry to touch the connection in use right now.
 */
let savedNets=[];
function parseWifiList(text){
  const out=[];
  (text||"").split("\n").forEach(line=>{
    const m=line.match(/^\s*(\d+)\s+(.+)$/);
    if(m)out.push({idx:+m[1],ssid:m[2]});
  });
  return out;
}
async function loadSavedNets(){
  const r=await cmd("wifi list");
  savedNets=parseWifiList(r.out);
  const el=$("savedNets");
  if(!el)return; /* same race as paintWifiNow() - stepped past before this resolved */
  el.innerHTML=savedNets.length?savedNets.map(n=>`<li>
      <span>${esc(n.ssid)}</span>
      <span style="display:flex;gap:8px;flex:0 0 auto">
        <button class="ghost sm" data-act="editnet" data-idx="${n.idx}">${esc(t("bEditNet"))}</button>
        <button class="ghost sm" data-act="delnet" data-idx="${n.idx}">${esc(t("bRemove"))}</button>
      </span></li>`).join("")
    : `<li class="other"><span>${esc(t("noSavedNets"))}</span></li>`;
}
document.addEventListener("click",ev=>{
  const b=ev.target.closest("#savedNets button[data-act]");
  if(!b)return;
  const idx=+b.dataset.idx, n=savedNets.find(x=>x.idx===idx);
  if(!n)return;
  if(b.dataset.act==="delnet")delSavedNet(idx);
  if(b.dataset.act==="editnet")openEditNet(idx,n.ssid);
});
async function delSavedNet(idx){
  if(!confirm(t("delNetConfirm")))return;
  await cmd(`wifi del ${idx}`);
  loadSavedNets();
}
function openEditNet(idx,ssid){
  $("dlg").innerHTML=`

    if(!ssid2){$("dlgErr").textContent=t("needSsid");$("dlgErr").classList.remove("hide");return;}
    const pass=$("dlgPass").value;

    dlgClose();

function renderNets(list){
  scanned=list;

      <span class="db">${n.rssi} ${esc(t("dbm"))}</span></li>`).join("");

/* The running list of what has been saved this step, so it is obvious that

 * actually took - nothing else on this page says so once the dialog closes. */
function paintAddedNets(){
  const wrap=$("addedWrap"); if(!wrap)return;
  wrap.classList.toggle("hide",wiz.addedNets.length===0);

async function scan(){
  $("scanBtn").disabled=true;

  $("scanBtn").disabled=false;
  if(r.error){msg("⚠ "+r.error,"err");return;}
  const found=(r.out||"").split("\n").slice(1)
    .map(l=>/^\s*(.+?)\s{2,}\(([-\d]+) dBm\)\s*$/.exec(l)).filter(Boolean)
    .map(m=>({ssid:m[1],rssi:+m[2]}));

  msg(found.length?"":t("nothing"));

function openNet(index){
  const other=index<0;
  $("dlg").innerHTML=`
    <div class="dlgTitle">${esc(other?t("bOther"):scanned[index].ssid)}</div>

    if(!ssid){$("dlgErr").textContent=t("needSsid");$("dlgErr").classList.remove("hide");return;}
    const pass=$("dlgPass").value;
    $("dlgJoinBtn").disabled=true;
    /* Only "wifi add" - this saves the network, it does not switch to it.
     * Reaching this page at all means the hub is already online, so there

    const saved=await cmd(`wifi add ${wifiEsc(ssid)} ${wifiEsc(pass)}`);

    dlgClose();
    wiz.addedNets.push(ssid);
    paintAddedNets();
    loadSavedNets();
    msg(t("netSaved").replace("{ssid}",ssid),"ok");
  };
  $("dlgBack").classList.add("open");
}

/* -------------------------------------------------------------- step: finish */
function stepFinish(){
  return `<h2>${esc(t("sFinish"))}</h2><p class="sub">${esc(t("sFinishSub"))}</p>
    <p class="note">${esc(wiz.lat?t("finishBody"):t("finishBodyNoLoc"))}</p>`;
}
async function finishSetup(){
  const devices=(await api("/api/devices")).devices||[];
  const pins=devices.filter(d=>d.type==="occupancy").map(d=>d.ep);

  /* Unchanged from what every board gets by default - see defHome() in the
   * real panel. The wizard does not touch this section at all. */
  const statusSec={n:"Status",w:[
    {t:"clock",i:uid(),x:0,y:0,w:3,h:2},
    {t:"weather",i:uid(),x:3,y:0,w:3,h:2},
    {t:"custom",i:uid(),x:6,y:0,w:3,h:2},
    {t:"bridge",i:uid(),x:9,y:0,w:3,h:2}]};

  /* Pinned devices: the vibration sensor always, plus - only when a location
   * was actually given - four sensor-style cards fed by it: temperature
   * (the same "weather" widget the Status section uses, just pointed at the
   * real coordinates instead of the generic default), humidity, rain and
   * air quality. All four read from Open-Meteo; three of them have no
   * dedicated widget type, so they are "custom" blocks pointed at the right
   * field, same mechanism the Settings screen exposes for anyone binding a
   * device to an external API. */
  const pinnedW=[{t:"devices",m:"pin",i:uid(),x:0,y:0,w:12,h:4}];
  if(wiz.lat&&wiz.lon){
    pinnedW.push(
      {t:"weather",i:uid(),x:0,y:4,w:3,h:2,la:wiz.lat,lo:wiz.lon},
      {t:"custom",i:uid(),x:3,y:4,w:3,h:2,n:"Humidity",
       u:`https://api.open-meteo.com/v1/forecast?latitude=${wiz.lat}&longitude=${wiz.lon}&current=relative_humidity_2m`,
       rf:"json",p:"current.relative_humidity_2m",k:"num",dc:0,sf:"%"},
      {t:"custom",i:uid(),x:6,y:4,w:3,h:2,n:"Rain",
       u:`https://api.open-meteo.com/v1/forecast?latitude=${wiz.lat}&longitude=${wiz.lon}&current=rain`,
       rf:"json",p:"current.rain",k:"num",dc:1,sf:"mm"},
      {t:"custom",i:uid(),x:9,y:4,w:3,h:2,n:"Air quality",
       u:`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${wiz.lat}&longitude=${wiz.lon}&current=us_aqi`,
       rf:"json",p:"current.us_aqi",k:"num",dc:0});
  }
  const pinnedSec={n:"Pinned devices",w:pinnedW};
  const pairingSec={n:"Pairing",w:[{t:"pairing",i:uid(),x:0,y:0,w:6,h:4}]};

  const ui={tz:wiz.tz,tzOffset:wiz.tzOffset,lat:wiz.lat||undefined,lon:wiz.lon||undefined,
            pins,home:[statusSec,pinnedSec,pairingSec]};
  /* Not api() - that helper sends application/x-www-form-urlencoded, which is
   * right for every other call in this file but wrong for a raw JSON body: the
   * board's WebServer library tries to parse it as key=value pairs, finds
   * none, and handleUiPost() ends up with nothing to save. text/plain is what
   * the real panel's own saveUi() sends for exactly this endpoint - matched
   * here so this call actually lands instead of failing silently while still
   * navigating on as if it had (which is also why finishSetup() used to leave
   * the wizard un-clearable: handleUiPost() only clears the wizard's pending
   * marker when the save actually succeeds, see web_ui.cpp). */
  let ok=false;
  try{
    const r=await(await fetch("/api/ui",{method:"POST",
      headers:{"Content-Type":"text/plain"},body:JSON.stringify(ui)})).json();
    ok=!!(r&&r.ok);
  }catch(e){}
  if(!ok){
    msg(t("saveFail"),"err");
    return;
  }
  location.href="/";
}

/* -------------------------------------------------------------- flow */
const STEPS=[stepUsers,stepTz,stepLocation,stepWifi,stepFinish];

/* Step 1 is the mandatory one - an admin account is what the rest of this
 * board's security depends on, so the forward button stays disabled rather
 * than clickable-then-refused until the fields could actually pass. Once
 * the account exists (saveUsers() already ran once) there is nothing left
 * to withhold it for, even if the visitor comes back to this step to add
 * one more person. */
function updateFwdState(){
  const b=$("fwdBtn");
  if(!b||step!==1)return;
  if(usersCreated){b.disabled=false;return;}
  const name=$("uName").value.trim(), pass=$("uPass").value, pass2=$("uPass2").value;
  b.disabled=!(name.length>=2&&pass.length>=8&&pass===pass2);
}

function render(){
  document.title=t("title");
  $("h1").textContent=t("title");
  $("steps").innerHTML=Array.from({length:TOTAL},(_,i)=>
    `<i class="${i+1<step?"done":i+1===step?"on":""}"></i>`).join("");
  $("body").innerHTML=STEPS[step-1]();
  msg("");
  if(step===1)paintExtra();
  if(step===2)paintTzPreview();
  if(step===3)paintLoc();
  if(step===4){paintWifiNow();loadSavedNets();renderNets([]);}

  const nav=document.createElement("div");
  nav.className="btns";
  if(step>1){
    const back=document.createElement("button");
    back.className="ghost"; back.textContent=t("bBack"); back.onclick=()=>{step--;render();};
    nav.appendChild(back);
  }
  const fwd=document.createElement("button");
  fwd.id="fwdBtn";
  fwd.textContent=step===TOTAL?t("bFinish"):t("bNext");
  fwd.onclick=async()=>{
    if(step===1){
      fwd.disabled=true;
      const err=await saveUsers();
      fwd.disabled=false;
      if(err){msg("⚠ "+err,"err");return;}
    }
    if(step===TOTAL){
      /* finishSetup() awaits a device list, then a save, on a board that is
       * also answering a scan or a bind test for someone else - a few
       * seconds with nothing on screen reads as hung, not busy. */
      fwd.disabled=true;
      const label=fwd.textContent;
      fwd.textContent=t("bSaving");
      await finishSetup();
      fwd.disabled=false;
      fwd.textContent=label;
      return;
    }
    step++; render();
  };
  nav.appendChild(fwd);
  $("body").appendChild(nav);
  updateFwdState();
}

/* A reload mid-setup re-runs this whole script from scratch, and the wizard
 * is now kept on screen for exactly that case (the board's own note on it:
 * setup stays pending until finishSetup() saves). Without this check, step 1
 * would try to create the admin a second time with the same name and fail -
 * the tab already holds a valid session from the first attempt, so ask
 * before assuming there isn't one. */
(async()=>{
  const s=await api("/api/session");
  if(s&&s.name){usersCreated=true;wiz.adminName=s.name;}
  render();
})();
</script>
