# This sample uses Kconfig.defaults to set options common for all
# samples. This file should contain only options specific for this sample
# or overrides of default values.

# Enable CHIP
CONFIG_CHIP=y
CONFIG_CHIP_PROJECT_CONFIG="src/chip_project_config.h"
CONFIG_CHIP_DEVICE_PRODUCT_NAME="Matter Template"

# Configure ZAP file name
CONFIG_NCS_SAMPLE_MATTER_ZAP_FILE_PATH="${APPLICATION_CONFIG_DIR}/src/default_zap/template.zap"

# 32768 == 0x8000 (example Product ID added temporaly,
# but it must be changed with proper PID from the list:
# https://github.com/project-chip/connectedhomeip/blob/482e6fd03196a6de45465a90003947ef4b86e0b1/docs/examples/discussion/PID_allocation_for_example_apps.md)
CONFIG_CHIP_DEVICE_PRODUCT_ID=32768
CONFIG_STD_CPP17=y

# Enable Matter pairing automatically on application start.
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y

# Enable Matter extended announcement and increase duration to 1 hour.
CONFIG_CHIP_BLE_EXT_ADVERTISING=y
CONFIG_CHIP_BLE_ADVERTISING_DURATION=60

# Add support for LEDs and buttons on Nordic development kits
CONFIG_DK_LIBRARY=y

# Bluetooth Low Energy configuration
CONFIG_BT_DEVICE_NAME="MatterTemplate"

# Other settings
CONFIG_THREAD_NAME=y
CONFIG_MPU_STACK_GUARD=y
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_CHIP_LIB_SHELL=y
CONFIG_NCS_SAMPLE_MATTER_TEST_SHELL=y

# Disable NFC onboarding
CONFIG_CHIP_NFC_ONBOARDING_PAYLOAD=n

# Reduce application size
CONFIG_USE_SEGGER_RTT=n

# Factory data: off.
#
# Set here rather than in boards/xiao_nrf54l15_nrf54l15_cpuapp.conf because a
# board fragment does not win against an explicit assignment in prj.conf - the
# board file said =n and the build still came out =y.
#
# The XIAO has no factory_data partition (no external flash, and the layout
# does not carve one out), so the provider fails to compile at all:
# FactoryDataProvider.h needs DT_NODELABEL(factory_data_partition). Matter uses
# the development certificates compiled into the firmware instead.
# NOTE: CONFIG_CHIP_FACTORY_DATA=n does NOT work here. In NCS 3.4 the provider
# sits behind `choice CHIP_FACTORY_DATA_BACKEND`, whose default member selects
# CHIP_FACTORY_DATA - and a select cannot be overridden by =n in a fragment.
# Picking the "none" member of the choice is the supported way to turn it off.
# (In 3.2.3 there was no choice and plain =n was enough.)
CONFIG_CHIP_FACTORY_DATA_NONE=y
