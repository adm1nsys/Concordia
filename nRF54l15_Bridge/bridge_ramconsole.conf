# Console into RAM, read out over SWD.
#
# For debugging only. Both UARTs on this board have been unreadable - the
# header pins go quiet and the USB console emits a handful of corrupt bytes at
# every baud rate - which meant Zephyr's fault dump, the one thing that says
# what actually crashed, was being written into a void. A RAM console does not
# care about clocks, pins or a debug chip's CDC: the text lands in a buffer at a
# known address and a debugger reads it out afterwards.
#
# Add as the last Extra Kconfig fragment; remove it for normal builds.
CONFIG_RAM_CONSOLE=y
CONFIG_RAM_CONSOLE_BUFFER_SIZE=4096

# The UART console must go, or it stays the active console driver and the RAM
# buffer never receives a byte - which looks exactly like "nothing was printed".
CONFIG_UART_CONSOLE=n
